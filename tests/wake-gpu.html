<!doctype html>
<meta charset="utf-8">
<title>Wake GPU regression check</title>
<style>body{background:#10202c;color:#dcebf4;font:16px monospace;padding:24px}canvas{display:block;margin-top:20px}</style>
<h1>Wake GPU regression check</h1>
<pre id="result">Running GPU / CPU comparison...</pre>
<script src="../node_modules/three/build/three.min.js"></script>
<script src="../kelvin-wake.js"></script>
<script src="../kelvin-renderer.js"></script>
<script>
(async function () {
  const output = document.getElementById('result');
  try {
    const canvas = document.createElement('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, context: canvas.getContext('webgl2') });
    renderer.setSize(400, 400);
    document.body.appendChild(canvas);
    const size = 4, resolution = 256;
    const field = new KelvinWakeField(THREE, new THREE.Vector2(size, size), resolution);
    const pixels = new Float32Array(resolution * resolution * 4);
    const results = [];
    let totalSamples = 0;
    let divergentPeak = 0;
    for (const scenario of [
      { name: 'Cruise', speed: .18, heading: 0 },
      { name: 'Slow', speed: .07, heading: 0 },
      { name: 'Fast', speed: .45, heading: 0 },
      { name: 'Rotated', speed: .18, heading: .93 },
      { name: 'Turning', speed: .18, heading: 0, turn: .14 },
      { name: 'Bow at 1 knot', speed: 1852/3600/40, heading: .7, hull: true, heightLimit: .001/40 },
      { name: 'Bow at 3 knots', speed: 3*1852/3600/40, heading: -.8, hull: true, heightLimit: .008/40 },
      { name: 'Turning bow at 3 knots', speed: 3*1852/3600/40, heading: -.8, hull: true, hullTurn: .8, heightLimit: .012/40 },
      { name: 'Calm-water bow at 4 knots', speed: 4*1852/3600/40, heading: .5, hull: true, heightLimit: .015/40 },
    ]) {
      field.clear();
      let px = -.8, pz = -.3;
      for (let t = 0; t < 10; t += .25) {
        const angle = scenario.heading + t * (scenario.turn || 0);
        const dx = Math.cos(angle), dz = Math.sin(angle);
        field.add(KelvinWake.emit({
          x: px, z: pz, dx, dz, speed: scenario.speed,
          length: .6, beam: .09, draft: .02, gravity: 9.81 / 40,
          time: t, dt: .25, isShip: true, minWavelength: .08,
        }));
        px += dx * scenario.speed * .25; pz += dz * scenario.speed * .25;
      }
      if (scenario.hull) field.setHulls([KelvinWake.hull({ x: px, z: pz,
        dx: Math.cos(scenario.heading), dz: Math.sin(scenario.heading), speed: scenario.speed,
        length:.6, beam:.09, draft:.02, gravity:9.81/40, isShip:true, owner:scenario.name,
        turn: scenario.hullTurn || 0 })], 1);
      field.update(renderer, 10, 16);
      renderer.readRenderTargetPixels(field.target, 0, 0, resolution, resolution, pixels);
      for (let i = 0; i < pixels.length; i += 4) {
        if (![pixels[i], pixels[i+1], pixels[i+2], pixels[i+3]].every(Number.isFinite)) {
          throw new Error('Non-finite wave/foam channel');
        }
        if (Math.abs(pixels[i+3]) > pixels[i+2] + .000001) throw new Error('Invalid crest envelope');
        if (scenario.heightLimit && Math.abs(pixels[i]) > scenario.heightLimit) {
          throw new Error(scenario.name + ': excessive calm-water displacement ' + pixels[i]*40 + ' m');
        }
        divergentPeak = Math.max(divergentPeak, pixels[i+2]);
      }
      let maxError = 0, maxHeight = 0, count = 0;
      for (let y = 0; y < resolution; y += 4) for (let x = 0; x < resolution; x += 4) {
        const cpu = field.sample(((x + .5) / resolution - .5) * size, ((y + .5) / resolution - .5) * size);
        const gpu = pixels[(y * resolution + x) * 4];
        if (!Number.isFinite(gpu)) throw new Error('Non-finite GPU wave height');
        maxError = Math.max(maxError, Math.abs(cpu - gpu));
        maxHeight = Math.max(maxHeight, Math.abs(gpu)); count++;
      }
      if (maxError > .00002 || maxHeight < .000001 || maxHeight > .02) {
        throw new Error(scenario.name + ': ' + JSON.stringify({ maxError, maxHeight, count }));
      }
      results.push(scenario.name + ': ' + count + ' samples, max error ' + maxError.toExponential(3) +
        ', peak ' + maxHeight.toFixed(6) + ', packets ' + field.active.length);
      totalSamples += count;
    }
    // Synchronous completion makes this useful even in a background-throttled
    // browser. This measures the isolated wake pass, NOT full-scene FPS.
    const timings = [], gl = renderer.getContext();
    for (let i = 0; i < 16; i++) {
      gl.finish();
      const start = performance.now();
      field.update(renderer, 10, 16);
      gl.finish();
      if (i >= 4) timings.push(performance.now() - start);
    }
    timings.sort((a, b) => a - b);
    results.push('Isolated 256px wake update + GPU completion, median: ' +
      timings[Math.floor(timings.length / 2)].toFixed(2) + ' ms (not full-scene FPS)');
    if (divergentPeak < .00001) throw new Error('Missing divergent-wave channels');

    // Exercise the actual foam shader: previous source-count tests could not
    // catch foam which missed a crest, disappeared in 8-bit quantization, or
    // never reached the simulation at all.
    const [vertexShader, fragmentShader] = await Promise.all([
      fetch('../shaders/simulation/vertex.glsl').then(r => r.text()),
      fetch('../shaders/simulation/foam_update_fragment.glsl').then(r => r.text()),
    ]);
    const foamSize = 96;
    const blank = new THREE.DataTexture(new Float32Array(4), 1, 1, THREE.RGBAFormat, THREE.FloatType);
    blank.needsUpdate = true;
    const fixture = new Float32Array(foamSize * foamSize * 4);
    const syntheticWave = new THREE.DataTexture(fixture, foamSize, foamSize, THREE.RGBAFormat, THREE.FloatType);
    syntheticWave.needsUpdate = true;
    const makeTarget = () => new THREE.WebGLRenderTarget(foamSize, foamSize, {
      type: THREE.FloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      depthBuffer: false, stencilBuffer: false,
    });
    const targets = [makeTarget(), makeTarget()];
    let current = 0;
    const uniforms = {
      foamTexture: { value: targets[0].texture }, waterTexture: { value: blank },
      wakeSourceTexture: { value: blank }, kelvinTexture: { value: syntheticWave },
      delta: { value: new THREE.Vector2(1/foamSize, 1/foamSize) },
      waterDelta: { value: new THREE.Vector2(1/foamSize, 1/foamSize) },
      waterSize: { value: new THREE.Vector2(size, size) },
      timeStep: { value: 1/60 }, time: { value: 0 }, foamDecay: { value: .48 },
      farWakeLifetime: { value: 8 }, foamAdvectionSpeed: { value: .72 },
      foamGenerationThreshold: { value: .009 }, turbulenceIntensity: { value: 0 },
      diffusion: { value: 0 },
    };
    const foamMesh = new THREE.Mesh(new THREE.PlaneBufferGeometry(2,2),
      new THREE.RawShaderMaterial({ uniforms, vertexShader, fragmentShader }));
    const foamCamera = new THREE.Camera();
    const foamPixels = new Float32Array(fixture.length);
    const clearFoam = () => {
      renderer.setClearColor(0,0);
      for (const target of targets) { renderer.setRenderTarget(target); renderer.clear(); }
      current = 0;
    };
    const foamStep = dt => {
      uniforms.timeStep.value = dt;
      uniforms.foamTexture.value = targets[current].texture;
      current = 1-current;
      renderer.setRenderTarget(targets[current]);
      renderer.render(foamMesh, foamCamera);
    };
    const readFoam = () => {
      renderer.readRenderTargetPixels(targets[current], 0, 0, foamSize, foamSize, foamPixels);
      if (foamPixels.some(v => !Number.isFinite(v))) throw new Error('Non-finite foam');
      let sum = 0;
      for (let i=0;i<foamPixels.length;i+=4) sum += foamPixels[i];
      return sum;
    };
    const makeWave = (amplitude, cancelled = false) => {
      for (let y=0;y<foamSize;y++) for (let x=0;x<foamSize;x++) {
        const i=(y*foamSize+x)*4;
        const height=cancelled ? 0 : amplitude*Math.cos(((x+.5)/foamSize-.5)*size*22);
        fixture[i]=height; fixture[i+1]=height*22*22;
        fixture[i+2]=amplitude; fixture[i+3]=height;
      }
      syntheticWave.needsUpdate=true;
      uniforms.kelvinTexture.value=syntheticWave;
    };
    makeWave(.002); clearFoam(); foamStep(1/60);
    if (readFoam() <= 1) throw new Error('No side-crest foam generated');
    for (let i=0;i<fixture.length;i+=4) {
      if (fixture[i]<=0 && foamPixels[i]>1e-7) throw new Error('New foam generated in a trough');
    }
    makeWave(.002, true); clearFoam(); foamStep(1/60);
    if (readFoam()>1e-7) throw new Error('Cancelled waves generate phantom foam');
    const totals=[];
    for (const hz of [30,60,120]) {
      makeWave(.002); clearFoam();
      for(let i=0;i<hz;i++) foamStep(1/hz);
      totals.push(readFoam());
      for(let i=0;i<foamPixels.length;i+=4) if (foamPixels[i]>.10001) {
        throw new Error('Side foam saturated into an opaque sheet');
      }
    }
    if ((Math.max(...totals)-Math.min(...totals))/totals[1]>.02) throw new Error('Foam depends on frame rate');
    const beforeStop=readFoam(); uniforms.kelvinTexture.value=blank;
    for(let i=0;i<120;i++) foamStep(1/60);
    const afterStop=readFoam();
    if (!(afterStop>0 && afterStop<beforeStop*.8)) throw new Error('Old foam must persist and decay after stopping');
    for (const turn of [0, .14]) {
      field.clear();
      let x=-1, z=-.4;
      for (let t=0;t<8;t+=.25) {
        const dx=Math.cos(t*turn), dz=Math.sin(t*turn);
        field.add(KelvinWake.emit({ x,z,dx,dz,speed:.18,length:.6,beam:.09,draft:.02,
          gravity:9.81/40,time:t,dt:.25,isShip:true,minWavelength:.08,
          turn:KelvinWake.turnFromMotion(Math.sin(turn*.25),-turn,0,.18) }));
        x+=dx*.18*.25; z+=dz*.18*.25;
      }
      field.update(renderer,8,16);
      uniforms.kelvinTexture.value=field.target.texture; clearFoam();
      for(let i=0;i<60;i++) foamStep(1/60);
      const total=readFoam();
      if (total<=.01) throw new Error('Real Kelvin wake does not generate side foam (turn '+turn+')');
      results.push('Real '+(turn?'turning':'straight')+' wake foam coverage: '+total.toFixed(3));
    }
    results.push('Foam: real Kelvin crests emit; troughs/cancelled waves do not; 30/60/120 Hz within 2%; stopped foam fades');
    renderer.setRenderTarget(null);
    // Stopping adds no sources: all historical packets must eventually expire,
    // including clearing their previous GPU pixels rather than leaving a ghost.
    for (let i=0;i<120;i++) field.setHulls([],1/60);
    field.update(renderer, 27, 16);
    renderer.readRenderTargetPixels(field.target, 0, 0, resolution, resolution, pixels);
    if (field.active.length || pixels.some(value => value !== 0)) throw new Error('Stale wake after expiration');
    output.textContent = 'PASS: ' + totalSamples.toLocaleString('en-US') + ' GPU samples match CPU wave heights\n' +
      results.join('\n') + '\nStopped: history expires and GPU field is empty';
  } catch (error) { output.textContent = 'FAIL: ' + error.message; }
})();
</script>
